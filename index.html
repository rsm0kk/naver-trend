<style>
:root{
  --bg:#f3f6f9;--panel:#ffffff;--panel-2:#f7f9fc;--navy:#172b4d;

  --bg:#0d1420;--panel:#16202f;--panel-2:#1b2739;--navy:#0b1830;

@media (prefers-color-scheme: dark){

    --bg:#0d1420;--panel:#16202f;--panel-2:#1b2739;--navy:#0b1830;
    --line:#2b3b52;--line-soft:#1e2b3d;--ink:#eaf1fa;--ink-2:#b3c3d6;--ink-3:#8fa3ba;

  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
body{overflow-x:hidden}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
header{background:var(--navy);color:#fff;padding:16px 20px}
header .row{max-width:1180px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
header h1{margin:0;font-size:20px}
header .sub{color:#d6e2f5;font-size:13px}
header button{background:transparent;color:#fff;border:1px solid #8aa1c4;border-radius:8px;min-height:44px;padding:0 14px;font:inherit;cursor:pointer}
nav.tabs{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav.tabs .row{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 12px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--ink-2);font:inherit;font-weight:600;min-height:48px;padding:0 14px;white-space:nowrap;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:16px 16px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:18px}
.card h3{margin:0 0 8px;font-size:16px}
.muted{color:var(--ink-2);font-size:13px}
.caption{color:var(--ink-3);font-size:12.5px}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:10px 0 6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:var(--panel);color:var(--ink-2);border:0;border-right:1px solid var(--line);font:inherit;font-size:14px;min-height:40px;min-width:48px;padding:0 12px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.btn{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:9px;min-height:40px;padding:0 12px;font:inherit;font-size:14px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 4px}
.legend button{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--ink);font:inherit;font-size:14px;min-height:36px;cursor:pointer;padding:0 2px}
.legend button[aria-pressed="false"]{opacity:.4;text-decoration:line-through}
.sw{width:14px;height:4px;border-radius:2px;display:inline-block}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap}
th{background:var(--panel-2);color:var(--ink-2);font-weight:600;position:sticky;top:0;cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left}
td.l{text-align:left;white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
.up{color:var(--up)}.down{color:var(--down)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.kw{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;padding:12px}
.kw .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 12px;font-size:13.5px;margin:6px 0}
.kw .stats b{font-size:15px}
.note{background:var(--warn-soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--ink)}
details summary{cursor:pointer;min-height:36px;display:flex;align-items:center;color:var(--accent);font-weight:600}
ul.posts{margin:6px 0 0;padding-left:18px;font-size:13.5px}
ul.posts li{margin:3px 0;word-break:keep-all;overflow-wrap:anywhere}
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px 10px;font-size:13px;display:none;min-width:150px}
#tip .t{font-weight:700;margin-bottom:4px}
#tip .r{display:flex;justify-content:space-between;gap:14px}
#tip .src{color:var(--ink-3);font-size:11.5px;margin-top:4px}
svg text{fill:var(--ink-2);font-size:12px;font-family:inherit}
svg .grid line{stroke:var(--line-soft)}
svg .axis{stroke:var(--line)}
footer{max-width:1180px;margin:0 auto;padding:0 16px 32px;color:var(--ink-3);font-size:12.5px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>

function barChart(host,o){

/* ---------- 지표 계산 ---------- */
function seriesOf(th,flt,unit){const t=th.trend[flt]&&th.trend[flt][unit];return t||null}
function lastIdx(a){for(let i=a.length-1;i>=0;i--)if(a[i]!=null)return i;return -1}
function kpis(th,flt){
  const D=seriesOf(th,flt,"date"),M=seriesOf(th,flt,"month"),cm=DATA.current_month;
  return th.keywords.map((k,j)=>{
    const r={name:k};
    if(D){const v=D.series[j]?.values||[];const n=v.length;const avg=a=>{const b=a.filter(x=>x!=null);return b.length?b.reduce((s,x)=>s+x,0)/b.length:null};
      r.d7=avg(v.slice(n-7));r.p7=avg(v.slice(n-14,n-7));r.w=ch(r.d7,r.p7);r.d28=avg(v.slice(n-28))}
    if(M){const per=M.periods,v=M.series[j]?.values||[];const done=per.map((p,i)=>[p,v[i]]).filter(([p])=>p<cm);
      const L=done.length;if(L){r.mLast=done[L-1][1];r.mLabel=done[L-1][0].slice(0,7);r.mom=L>1?ch(done[L-1][1],done[L-2][1]):null;
        const ly=done.find(([p])=>p.slice(0,7)===(+done[L-1][0].slice(0,4)-1)+done[L-1][0].slice(4,7));r.yoy=ly?ch(done[L-1][1],ly[1]):null;
        const last12=done.slice(-12).map(x=>x[1]).filter(x=>x!=null);r.hi=last12.length?ch(done[L-1][1],Math.max(...last12)):null}}
    return r})
}

  const kt=$("#kt");if(kt)kt.querySelectorAll("th").forEach((h,ci)=>h.onclick=()=>{const rows=[...kt.tBodies[0].rows];const dir=h.dataset.dir==="1"?-1:1;h.dataset.dir=dir===1?"1":"0";

    rows.sort((a,b)=>{const x=val(a),y=val(b);return (x>y?1:x<y?-1:0)*dir}).forEach(r=>kt.tBodies[0].appendChild(r))});
}
function isDark(){const a=document.documentElement.getAttribute("data-theme");if(a==="dark")return true;if(a==="light")return false;return matchMedia("(prefers-color-scheme: dark)").matches}
function syncBtn(){$("#themeBtn").textContent=isDark()?"라이트 모드":"다크 모드"}
function init(){
  if(!DATA){$("#main").innerHTML='<div class="card note">데이터가 없습니다. trend_dash.py 실행 결과를 확인하세요.</div>';return}
  $("#asof").textContent=`기준 ${DATA.generated_at.replace("T"," ")} KST · 출처 네이버 데이터랩·검색(NAVER API HUB)`;
  $("#tabs").innerHTML=`<button type="button" role="tab" data-tab="-1">전체 요약</button>`+DATA.themes.map((t,i)=>`<button type="button" role="tab" data-tab="${i}">${esc(t.short||t.name)}</button>`).join("");
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{st.tab=+b.dataset.tab;render()});
  $("#themeBtn").onclick=()=>{document.documentElement.setAttribute("data-theme",isDark()?"light":"dark")};
  new MutationObserver(()=>{syncBtn();render()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{syncBtn();render()});
  let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(render,150)});
  $("#foot").innerHTML=`<p>· 상대지수는 같은 탭·같은 대상(전체/여성 19~59세) 안에서만 수준 비교가 가능합니다. 매일 전체 기간을 다시 받아 과거 값도 조금씩 바뀔 수 있습니다.</p>
  <p>· 언급 수는 공개 검색결과 표본이며 실제 게시글 전체 수가 아닙니다. 검색 관심 증가가 매출·시술 증가를 입증하지는 않습니다.</p>
  <p>· 이번 갱신 API 호출 ${DATA.calls}회${DATA.failures.length?` · 실패 ${DATA.failures.length}건: ${DATA.failures.map(esc).join(" / ")}`:" · 실패 없음"}</p>`;
  syncBtn();render();
}
init();
</script>
